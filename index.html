<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการสต็อก</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f0f2f5; padding: 15px; margin: 0; text-align: center; color: #333; }
        .container { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); max-width: 600px; margin: 0 auto; }
        h2 { margin-top: 0; color: #444; }
        .mode-container { display: flex; gap: 10px; margin-bottom: 15px; }
        .mode-btn { flex: 1; padding: 12px; border-radius: 10px; border: 2px solid #e0e0e0; font-weight: bold; cursor: pointer; background: white; transition: all 0.2s; }
        .active-in { background: #d4edda; border-color: #28a745; color: #155724; box-shadow: 0 2px 5px rgba(40, 167, 69, 0.2); }
        .active-out { background: #f8d7da; border-color: #dc3545; color: #721c24; box-shadow: 0 2px 5px rgba(220, 53, 69, 0.2); }
        .active-new { background: #cce5ff; border-color: #004085; color: #004085; box-shadow: 0 2px 5px rgba(0, 64, 133, 0.2); }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        .info-display { background-color: #e9ecef; border: 1px solid #ced4da; color: #495057; font-weight: bold; cursor: not-allowed; }
        .hidden { display: none; }
        #reader { width: 100%; margin-bottom: 10px; border-radius: 10px; overflow: hidden; display: none; background: #000; }
        .btn-submit { width: 100%; padding: 15px; font-size: 18px; color: white; background: #999; border: none; border-radius: 10px; cursor: not-allowed; margin-top: 15px; font-weight: bold; }
        .ready { cursor: pointer; }
        .ready-in { background: #28a745; }
        .ready-out { background: #dc3545; }
        .ready-new { background: #007bff; }
        #log { margin-top: 20px; text-align: left; font-size: 14px; max-height: 200px; overflow-y: auto; border-top: 1px solid #eee; padding-top: 10px; }
        .log-item { padding: 5px 0; border-bottom: 1px solid #f0f0f0; }
    </style>
</head>
<body>

<div class="container">
    <h2>🏭 จัดการคลังสินค้า</h2>

    <div class="mode-container">
        <button class="mode-btn" onclick="setMode('IN')" id="btn-in">📥 รับเข้า</button>
        <button class="mode-btn" onclick="setMode('OUT')" id="btn-out">📤 จ่ายออก</button>
        <button class="mode-btn" onclick="setMode('NEW')" id="btn-new">✨ สินค้าใหม่</button>
    </div>

    <div id="reader"></div>
    <button onclick="toggleCamera()" style="margin: 5px 0 15px 0; padding: 10px; width: 100%; cursor: pointer; background: #f8f9fa; border: 1px solid #ddd; border-radius: 8px;">📷 เปิด/ปิด กล้อง</button>

    <div id="form-area" class="hidden">
        <label style="display:block; text-align:left; font-weight:bold;">รหัสสินค้า (SKU):</label>
        <input type="text" id="sku" placeholder="สแกน หรือ พิมพ์..." onchange="searchProduct()">

        <div id="display-group">
            <label style="display:block; text-align:left; font-weight:bold; color:#007bff;">ชื่อสินค้า (จากระบบ):</label>
            <input type="text" id="name-display" class="info-display" readonly placeholder="รอการสแกน...">
        </div>

        <div id="new-item-fields" class="hidden">
            <input type="text" id="item-name" placeholder="ระบุชื่อสินค้าใหม่">
            <input type="number" id="ratio" placeholder="จำนวนย่อยต่อหน่วย (ใส่ 1 ถ้าไม่มี)" value="1">
        </div>

        <div style="display:flex; gap:10px;">
            <div style="flex:1;">
                <label style="display:block; text-align:left; font-weight:bold;">จำนวน:</label>
                <input type="number" id="qty" value="1">
            </div>
            <div style="flex:1;">
                <label style="display:block; text-align:left; font-weight:bold;">หน่วย:</label>
                <select id="unit">
                    <option value="ลัง">ลัง</option>
                    <option value="ถุง">ถุง</option>
                    <option value="มัด">มัด</option>
                    <option value="กก.">กก.</option>
                    <option value="กระสอบ">กระสอบ</option>
                    <option value="แพ็ค">แพ็ค</option>
                    <option value="ขวด">ขวด</option>
                    <option value="แกลลอน">แกลลอน</option>
                    <option value="ชิ้น">ชิ้น</option>
                </select>
            </div>
        </div>

        <label style="display:block; text-align:left; font-weight:bold; margin-top:10px;">ผู้ทำรายการ:</label>
        <input type="text" id="user" value="Admin" placeholder="ระบุชื่อพนักงาน">

        <button id="btn-submit" class="btn-submit" onclick="submitData()">กรุณาเลือกโหมด</button>
    </div>
    
    <div id="log">📝 ประวัติการทำงาน...</div>
</div>

<script>
    // 👇👇👇 ใส่ลิงก์ Web App URL ใหม่ตรงนี้ 👇👇👇
    const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbxUFigzAw_t_KFlMraPGbj95yFd2jmE6uvYcrk8BV2WDRuJ2WPzdslwg8lNQBzLVrrs/exec"; 
    // -----------------------------------------------------

    let currentMode = null;
    let html5QrcodeScanner = null;

    function setMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.mode-btn').forEach(b => b.className = 'mode-btn');
        document.getElementById('btn-' + mode.toLowerCase()).classList.add('active-' + mode.toLowerCase());
        
        document.getElementById('form-area').classList.remove('hidden');
        if (mode === 'NEW') {
            document.getElementById('new-item-fields').classList.remove('hidden');
            document.getElementById('display-group').classList.add('hidden');
        } else {
            document.getElementById('new-item-fields').classList.add('hidden');
            document.getElementById('display-group').classList.remove('hidden');
        }

        const btn = document.getElementById('btn-submit');
        btn.className = `btn-submit ready ready-${mode.toLowerCase()}`;
        btn.innerText = `ยืนยัน "${mode === 'IN' ? 'รับเข้า' : (mode === 'OUT' ? 'จ่ายออก' : 'สินค้าใหม่')}"`;
    }

    async function searchProduct() {
        const sku = document.getElementById('sku').value.trim();
        if(!sku || currentMode === 'NEW') return;

        const nameDisplay = document.getElementById('name-display');
        nameDisplay.value = "🔍 กำลังค้นหา...";
        nameDisplay.style.color = "orange";

        try {
            const response = await fetch(WEBHOOK_URL + "?mode=SEARCH&sku=" + encodeURIComponent(sku));
            const data = await response.json();

            if(data.status === 'success') {
                nameDisplay.value = data.name;
                nameDisplay.style.color = "green";
                const unitSelect = document.getElementById('unit');
                let found = false;
                for(let i=0; i<unitSelect.options.length; i++){
                    if(unitSelect.options[i].value === data.unit) {
                        unitSelect.selectedIndex = i;
                        found = true;
                        break;
                    }
                }
                if(!found && data.unit) {
                    let opt = document.createElement('option');
                    opt.value = data.unit;
                    opt.innerHTML = data.unit;
                    unitSelect.appendChild(opt);
                    unitSelect.value = data.unit;
                }
            } else {
                nameDisplay.value = "❌ ไม่พบสินค้า";
                nameDisplay.style.color = "red";
            }
        } catch(e) {
            nameDisplay.value = "⚠️ เชื่อมต่อไม่ได้";
            console.error(e);
        }
    }

    function toggleCamera() {
        const reader = document.getElementById('reader');
        if (reader.style.display === 'block') {
            if(html5QrcodeScanner) { html5QrcodeScanner.clear(); html5QrcodeScanner = null; }
            reader.style.display = 'none';
        } else {
            reader.style.display = 'block';
            html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
            html5QrcodeScanner.render((text) => {
                document.getElementById('sku').value = text;
                document.getElementById('reader').style.display = 'none';
                html5QrcodeScanner.clear();
                html5QrcodeScanner = null;
                searchProduct();
            });
        }
    }

    async function submitData() {
        if(!currentMode) { alert("กรุณาเลือกโหมดก่อน"); return; }
        
        const sku = document.getElementById('sku').value.trim();
        const qtyVal = document.getElementById('qty').value;
        
        // Validation หน้าบ้านก่อนส่ง
        if(!sku) { alert("กรุณาระบุรหัสสินค้า"); return; }
        if(!qtyVal || Number(qtyVal) <= 0) { alert("จำนวนต้องมากกว่า 0"); return; }

        const btn = document.getElementById('btn-submit');
        const oldText = btn.innerText;
        btn.innerText = "กำลังประมวลผล...";
        btn.disabled = true; // ป้องกันการกดรัวๆ

        const payload = {
            mode: currentMode,
            sku: sku,
            qty: qtyVal,
            unit: document.getElementById('unit').value,
            ratio: document.getElementById('ratio').value,
            name: document.getElementById('item-name').value,
            user: document.getElementById('user').value 
        };

        try {
            // ใช้ text/plain เพื่อให้ Apps Script อ่าน error ได้ง่ายๆ
            const response = await fetch(WEBHOOK_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            });
            
            const data = await response.json();

            if (data.status === 'error') {
                alert("❌ เกิดข้อผิดพลาด: " + data.message); 
            } else {
                const logDiv = document.getElementById('log');
                const time = new Date().toLocaleTimeString('th-TH', {hour: '2-digit', minute:'2-digit'});
                const color = currentMode === 'IN' ? 'green' : (currentMode === 'OUT' ? 'red' : 'blue');
                
                let logMsg = `<div class="log-item" style="color:${color}">[${time}] ✅ ${data.message}</div>`;
                logDiv.innerHTML = logMsg + logDiv.innerHTML;
                
                // ล้างค่า
                document.getElementById('sku').value = "";
                document.getElementById('qty').value = "1";
                document.getElementById('item-name').value = "";
                document.getElementById('name-display').value = "";
            }

        } catch(e) {
            alert("Connection Error: " + e.message);
        } finally {
            btn.innerText = oldText;
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
