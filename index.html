
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบคลังสินค้า (Pro Version)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f4f6f8; margin: 0; padding: 20px; text-align: center; }
        .container { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; margin: 0 auto; }
        
        /* ส่วนเลือกโหมด */
        .mode-selection { display: flex; gap: 10px; margin-bottom: 20px; }
        .mode-btn { flex: 1; padding: 15px; border: 2px solid #ddd; border-radius: 10px; background: white; font-size: 18px; font-weight: bold; color: #aaa; cursor: pointer; transition: 0.2s; }
        
        /* สีปุ่มเมื่อถูกเลือก */
        .mode-btn.active-in { background-color: #d4edda; border-color: #28a745; color: #155724; }
        .mode-btn.active-out { background-color: #f8d7da; border-color: #dc3545; color: #721c24; }

        .form-group { text-align: left; margin-bottom: 15px; }
        label { font-weight: bold; color: #333; display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        input:focus { outline: none; border-color: #007bff; }

        /* พื้นที่กล้อง */
        #reader { width: 100%; margin-bottom: 15px; border-radius: 10px; overflow: hidden; display: none; }
        
        /* ปุ่มยืนยัน */
        .btn-confirm { 
            width: 100%; padding: 15px; font-size: 20px; font-weight: bold; color: white; border: none; border-radius: 10px; cursor: pointer; 
            background-color: #ccc; /* สีเทาตอนยังไม่เลือกโหมด */
            pointer-events: none; /* กดไม่ได้ตอนแรก */
            transition: 0.3s;
        }
        .btn-confirm.ready-in { background-color: #28a745; pointer-events: auto; }
        .btn-confirm.ready-out { background-color: #dc3545; pointer-events: auto; }
        .btn-confirm:active { transform: scale(0.98); }

        .log { margin-top: 20px; font-size: 14px; text-align: left; background: #fafafa; padding: 10px; border-radius: 8px; height: 120px; overflow-y: auto; border: 1px solid #eee; }
        .log div { border-bottom: 1px solid #eee; padding: 5px 0; }
    </style>
</head>
<body>

<div class="container">
    <h2>📦 ระบบจัดการคลังสินค้า</h2>

    <div class="mode-selection">
        <button id="btn-in" class="mode-btn" onclick="selectMode('IN')">📥 รับเข้า</button>
        <button id="btn-out" class="mode-btn" onclick="selectMode('OUT')">📤 จ่ายออก</button>
    </div>

    <div id="reader"></div>
    <button id="btn-camera" onclick="toggleCamera()" style="margin-bottom:15px; padding:8px; width:100%; cursor:pointer; display:none;">📷 เปิด/ปิด กล้อง</button>

    <div class="form-group">
        <label>รหัสสินค้า (SKU):</label>
        <input type="text" id="sku" placeholder="สแกน หรือ พิมพ์รหัส..." autocomplete="off">
    </div>

    <div style="display:flex; gap:10px;">
        <div class="form-group" style="flex:1;">
            <label>จำนวน:</label>
            <input type="number" id="qty" value="1" min="1">
        </div>
        <div class="form-group" style="flex:1;">
            <label>ผู้ทำรายการ:</label>
            <input type="text" id="user" value="Admin">
        </div>
    </div>

    <button id="btn-submit" class="btn-confirm" onclick="submitData()">🚫 กรุณาเลือกโหมดก่อน</button>

    <div class="log" id="log">📝 ประวัติการทำงาน...</div>
</div>

<script>
    // ⚠️⚠️⚠️ วางลิงก์ n8n ของคุณตรงนี้ (ห้ามลบฟันหนู) ⚠️⚠️⚠️
    const WEBHOOK_URL = "https://sarawut24.app.n8n.cloud/webhook/scan-inventory"; 
    // --------------------------------------------------------

    let currentMode = null;
    let html5QrcodeScanner = null;

    function log(msg, color='black') {
        const logBox = document.getElementById('log');
        const time = new Date().toLocaleTimeString('th-TH');
        logBox.innerHTML = `<div style="color:${color}">[${time}] ${msg}</div>` + logBox.innerHTML;
    }

    function selectMode(mode) {
        currentMode = mode;
        
        // ปรับสีปุ่มเลือกโหมด
        document.getElementById('btn-in').className = mode === 'IN' ? 'mode-btn active-in' : 'mode-btn';
        document.getElementById('btn-out').className = mode === 'OUT' ? 'mode-btn active-out' : 'mode-btn';

        // ปรับปุ่มยืนยันด้านล่าง
        const submitBtn = document.getElementById('btn-submit');
        submitBtn.className = mode === 'IN' ? 'btn-confirm ready-in' : 'btn-confirm ready-out';
        submitBtn.innerText = mode === 'IN' ? '✅ ยืนยัน "รับเข้า" (IN)' : '✅ ยืนยัน "จ่ายออก" (OUT)';

        // แสดงปุ่มเปิดกล้อง
        document.getElementById('btn-camera').style.display = 'block';
        
        // ถ้าเพิ่งเลือกครั้งแรก ให้เปิดกล้องเลยเพื่อความสะดวก
        if (!html5QrcodeScanner) toggleCamera();
    }

    function toggleCamera() {
        const reader = document.getElementById('reader');
        if (reader.style.display === 'block') {
             // ปิดกล้อง
            if(html5QrcodeScanner) { html5QrcodeScanner.clear(); html5QrcodeScanner = null; }
            reader.style.display = 'none';
        } else {
            // เปิดกล้อง
            reader.style.display = 'block';
            html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
            html5QrcodeScanner.render(onScanSuccess);
        }
    }

    function onScanSuccess(decodedText) {
        // เมื่อสแกนติด -> แค่เอาเลขไปใส่ช่อง Input (ไม่ส่งข้อมูล)
        document.getElementById('sku').value = decodedText;
        
        // แจ้งเตือนเสียง หรือ สั่น (ถ้าทำได้)
        if (navigator.vibrate) navigator.vibrate(100);
        
        log(`📷 สแกนเจอ: ${decodedText} (กรุณากดยืนยัน)`, 'blue');
        
        // (Optional) ปิดกล้องหลังสแกนเสร็จเพื่อให้เห็นหน้าจอชัดๆ
        // toggleCamera(); 
    }

    async function submitData() {
        if (!currentMode) { alert("กรุณาเลือกโหมด รับเข้า หรือ จ่ายออก ก่อนครับ"); return; }
        
        const sku = document.getElementById('sku').value.trim();
        const qty = parseInt(document.getElementById('qty').value) || 0;
        const user = document.getElementById('user').value;

        if (!sku) { alert("❌ กรุณาระบุรหัสสินค้า (สแกน หรือ พิมพ์)"); return; }
        if (qty <= 0) { alert("❌ จำนวนต้องมากกว่า 0"); return; }

        const submitBtn = document.getElementById('btn-submit');
        const originalText = submitBtn.innerText;
        submitBtn.innerText = "⏳ กำลังบันทึก...";
        submitBtn.style.opacity = "0.5";

        try {
            log(`📡 กำลังส่งข้อมูล... ${sku} (${qty})`, '#555');
            
            const response = await fetch(WEBHOOK_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ sku: sku, action: currentMode, qty: qty, user: user })
            });

            const result = await response.json();

            if (response.ok) {
                log(`✅ บันทึกสำเร็จ: ${result.message || 'เรียบร้อย'}`, 'green');
                // ล้างช่อง SKU เพื่อรอชิ้นต่อไป (แต่คงโหมดเดิมไว้)
                document.getElementById('sku').value = "";
                document.getElementById('qty').value = "1";
            } else {
                log(`❌ เกิดข้อผิดพลาด: ${result.message}`, 'red');
                alert("บันทึกไม่ผ่าน: " + result.message);
            }

        } catch (error) {
            log(`❌ เชื่อมต่อไม่ได้: ${error.message}`, 'red');
            alert("เชื่อมต่อ Server ไม่ได้");
        }

        // คืนค่าปุ่ม
        submitBtn.innerText = originalText;
        submitBtn.style.opacity = "1";
    }
</script>

</body>
</html>
