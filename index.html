<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบจัดการคลัง</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* 🎨 THEME: Suki Teenoi Mobile Pro */
        :root { --teenoi-red: #CE1126; --teenoi-dark: #8B0000; --teenoi-gold: #FDB913; --bg-color: #f4f7f6; --success: #28a745; --error: #dc3545; }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Sarabun', sans-serif; background-color: var(--bg-color); padding: 0; margin: 0; color: #333; height: 100vh; display: flex; flex-direction: column; }
        
        .container { 
            background: white; flex-grow: 1; display: flex; flex-direction: column; 
            max-width: 600px; margin: 0 auto; box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }
        
        /* 🔥 HEADER COMPACT */
        .header-section { 
            background: linear-gradient(135deg, var(--teenoi-red), var(--teenoi-dark));
            padding: 10px 15px; color: white; border-bottom: 4px solid var(--teenoi-gold);
            display: flex; align-items: center; gap: 10px; flex-shrink: 0;
            position: sticky; top: 0; z-index: 100;
        }
        .app-logo { 
            width: 45px; height: 45px; object-fit: contain; background: white; 
            border-radius: 50%; padding: 2px; border: 2px solid var(--teenoi-gold);
        }
        h2 { margin: 0; font-size: 18px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .content-body { padding: 15px; overflow-y: auto; flex-grow: 1; -webkit-overflow-scrolling: touch; }

        /* ปุ่มโหมดแบบ Tab */
        .mode-container { display: flex; gap: 5px; margin-bottom: 15px; background: #eee; padding: 4px; border-radius: 12px; }
        .mode-btn { 
            flex: 1; padding: 10px; border: none; border-radius: 8px; 
            font-weight: 600; cursor: pointer; background: transparent; color: #777; font-size: 14px;
            transition: all 0.2s;
        }
        .active-in { background: white; color: #28a745; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .active-out { background: white; color: var(--teenoi-red); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .active-new { background: white; color: #007bff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        /* ฟอร์ม Input ใหญ่กดง่าย */
        input, select { 
            width: 100%; padding: 14px; margin: 5px 0; 
            border: 2px solid #e0e0e0; border-radius: 10px; 
            font-size: 16px; background-color: #fff; appearance: none;
        }
        input:focus, select:focus { outline: none; border-color: var(--teenoi-red); background-color: #fff; box-shadow: 0 0 0 3px rgba(206,17,38,0.1); }
        
        .form-section { 
            background: white; border: 1px solid #eee; padding: 15px; 
            border-radius: 12px; margin-bottom: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }
        .form-label { font-weight: 700; font-size: 14px; color: #555; margin-bottom: 2px; display: block; }
        .flex-row { display: flex; gap: 10px; } .flex-row > * { flex: 1; }

        #reader { width: 100%; margin-bottom: 10px; border-radius: 12px; overflow: hidden; display: none; background: #000; border: 3px solid var(--teenoi-gold); }
        
        /* ปุ่ม Main Action ใหญ่สะใจ */
        .btn-submit { 
            width: 100%; padding: 16px; font-size: 18px; color: white; 
            background: #ccc; border: none; border-radius: 12px; 
            cursor: not-allowed; margin-top: 10px; font-weight: 700; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: transform 0.1s;
        }
        .btn-submit:active { transform: scale(0.98); }
        .ready-in { background: linear-gradient(45deg, #28a745, #218838); }
        .ready-out { background: linear-gradient(45deg, #CE1126, #a10e1d); }
        .ready-new { background: linear-gradient(45deg, #007bff, #0056b3); }
        
        .camera-btn {
            width:100%; padding: 12px; cursor:pointer; background: #fff; color: var(--teenoi-red);
            border: 2px solid var(--teenoi-red); border-radius: 10px; margin-bottom: 15px; font-weight: bold;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }

        /* Toast Notification (แจ้งเตือนแบบเด้ง) */
        #toast {
            visibility: hidden; min-width: 280px; background-color: #333; color: #fff;
            text-align: center; border-radius: 50px; padding: 16px; position: fixed;
            z-index: 1000; left: 50%; bottom: 30px; transform: translateX(-50%);
            font-size: 16px; font-weight: bold; box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            opacity: 0; transition: opacity 0.3s, bottom 0.3s;
        }
        #toast.show { visibility: visible; opacity: 1; bottom: 50px; }
        #toast.success { background-color: #28a745; }
        #toast.error { background-color: #dc3545; }

        .hidden { display: none !important; }
        .info-display { background-color: #f8f9fa; border-color: #eee; color: #444; font-weight: 600; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <img src="https://drive.google.com/thumbnail?id=1pJv1ltq9eVPWYabYWWub9S3fR4QC4UuE&sz=w200" 
             alt="Logo" class="app-logo"
             onerror="this.onerror=null; this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/3/38/Suki_Teenoi_Logo.png/600px-Suki_Teenoi_Logo.png';">
        <h2>ระบบจัดการคลัง (Mobile)</h2>
    </div>

    <div class="content-body">
        <div class="mode-container">
            <button class="mode-btn" onclick="setMode('IN')" id="btn-in">รับเข้า</button>
            <button class="mode-btn" onclick="setMode('OUT')" id="btn-out">จ่ายออก</button>
            <button class="mode-btn" onclick="setMode('NEW')" id="btn-new">สินค้าใหม่</button>
        </div>

        <div id="group-scan">
            <div id="reader"></div>
            <button onclick="toggleCamera()" class="camera-btn">📷 เปิดกล้องสแกน</button>
            <div class="form-section">
                <span class="form-label">Scan SKU / ค้นหา:</span>
                <input type="text" id="sku" placeholder="ยิงบาร์โค้ด หรือ พิมพ์ชื่อ..." onkeyup="debouncedSearch()" inputmode="text">
                <input type="text" id="name-display" class="info-display" readonly placeholder="รายการสินค้า...">
            </div>
        </div>

        <div id="form-area" class="hidden">
            <div id="group-new" class="hidden">
                <div class="form-section">
                   <span class="form-label">ข้อมูลสินค้าใหม่:</span>
                   <div class="flex-row">
                       <input type="text" id="new-sku" placeholder="รหัส">
                       <input type="text" id="new-barcode" placeholder="บาร์โค้ด" inputmode="numeric">
                   </div>
                   <input type="text" id="item-name" placeholder="ชื่อสินค้า">
                   <div style="margin-top:5px"><div class="flex-row">
                       <input type="number" id="new-ratio" placeholder="ตัวคูณ" value="1" inputmode="numeric">
                       <input type="text" id="new-sap-unit" placeholder="หน่วย SAP">
                   </div></div>
                   <div class="flex-row"><input type="text" id="new-detail" placeholder="รายละเอียด"><input type="number" id="new-weight" placeholder="Kg" inputmode="decimal"></div>
                </div>
            </div>

            <div class="form-section" style="background-color: #fffafb; border-color: #ffe0e3;">
                <div class="flex-row">
                    <div style="flex: 1;">
                        <span class="form-label">จำนวน:</span>
                        <input type="number" id="qty" value="1" style="font-size: 22px; font-weight: 800; text-align: center; color: var(--teenoi-red);" onkeydown="checkEnter(event)" inputmode="numeric">
                    </div>
                    <div style="flex: 1.5;">
                        <span class="form-label">หน่วย:</span>
                        <select id="unit" style="font-weight: 600;">
                            <option value="ลัง">ลัง</option><option value="ถุง">ถุง</option><option value="มัด">มัด</option>
                            <option value="กก.">กก.</option><option value="กระสอบ">กระสอบ</option><option value="แพ็ค">แพ็ค</option>
                            <option value="ขวด">ขวด</option><option value="แกลลอน">แกลลอน</option><option value="ชิ้น">ชิ้น</option>
                        </select>
                    </div>
                </div>
                <div style="margin-top: 10px;">
                    <input type="text" id="user" placeholder="ระบุชื่อผู้ทำรายการ (จำเป็น)..." style="text-align: center; border: 2px dashed #ccc; background:#fff;">
                </div>
            </div>
            <button id="btn-submit" class="btn-submit" onclick="submitData()">เลือกโหมด</button>
        </div>
        
        <div style="height: 50px;"></div> </div>
</div>

<div id="toast">บันทึกข้อมูลสำเร็จ!</div>

<script>
    // 👇👇👇 ⚠️ ใส่ลิงก์ Web App URL ตรงนี้ ⚠️ 👇👇👇
    const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbzbERhsttg8qe1hhLmKWkBX9whgleWlRLlbYCbg58GwgXxDL1Oue7ErrXQpb9skRd4J/exec"; 
    // --------------------------------------------------------

    let currentMode = null;
    let html5QrcodeScanner = null;
    let searchTimeout = null;

    // ✅ โหลดชื่อผู้ใช้ + ตั้งค่าเริ่มต้น
    window.onload = function() {
        const savedUser = localStorage.getItem('teenoi_user');
        if(savedUser) document.getElementById('user').value = savedUser;
    }

    // ฟังก์ชันแสดง Toast Notification (แทน Alert เดิม)
    function showToast(message, type = 'success') {
        const x = document.getElementById("toast");
        x.innerText = message;
        x.className = "show " + type;
        
        // สั่นเครื่อง (Haptic Feedback)
        if (navigator.vibrate) {
            navigator.vibrate(type === 'error' ? [50, 50, 50] : 100);
        }

        setTimeout(function(){ x.className = x.className.replace("show", ""); }, 3000);
    }

    function setMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.mode-btn').forEach(b => b.className = 'mode-btn');
        document.getElementById('btn-' + mode.toLowerCase()).classList.add('active-' + mode.toLowerCase());
        document.getElementById('form-area').classList.remove('hidden');

        if (mode === 'NEW') {
            document.getElementById('group-scan').classList.add('hidden');
            document.getElementById('group-new').classList.remove('hidden');
        } else {
            document.getElementById('group-scan').classList.remove('hidden');
            document.getElementById('group-new').classList.add('hidden');
            setTimeout(() => document.getElementById('sku').focus(), 300);
        }

        const btn = document.getElementById('btn-submit');
        btn.className = `btn-submit ready-${mode.toLowerCase()}`;
        
        let txt = mode==='IN'?'✅ ยืนยัน "รับเข้า"':(mode==='OUT'?'✅ ยืนยัน "จ่ายออก"':'✨ ยืนยัน "สร้างสินค้าใหม่"');
        btn.innerText = txt;
        btn.disabled = false;
    }

    function debouncedSearch() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => { searchProduct(); }, 500);
    }

    function checkEnter(event) {
        if (event.key === "Enter") submitData();
    }

    async function searchProduct() {
        const sku = document.getElementById('sku').value.trim();
        if(!sku || currentMode === 'NEW') return;
        
        const nameDisplay = document.getElementById('name-display');
        nameDisplay.value = "🔍 กำลังค้นหา..."; nameDisplay.style.color = "orange";

        try {
            const response = await fetch(WEBHOOK_URL + "?mode=SEARCH&sku=" + encodeURIComponent(sku));
            const data = await response.json();
            if(data.status === 'success') {
                nameDisplay.value = data.name; 
                nameDisplay.style.color = "#28a745"; 
                // Auto Select Unit
                const unitSelect = document.getElementById('unit');
                let found = false;
                for(let i=0; i<unitSelect.options.length; i++){
                    if(unitSelect.options[i].value === data.unit) { unitSelect.selectedIndex = i; found = true; break; }
                }
                if(!found && data.unit) {
                    let opt = document.createElement('option'); opt.value = data.unit; opt.innerHTML = data.unit;
                    unitSelect.appendChild(opt); unitSelect.value = data.unit;
                }
                // สั่นเบาๆ เมื่อเจอของ
                if (navigator.vibrate) navigator.vibrate(50);
                document.getElementById('qty').focus();
                document.getElementById('qty').select();
            } else { 
                nameDisplay.value = "❌ ไม่พบสินค้า"; 
                nameDisplay.style.color = "red"; 
            }
        } catch(e) { nameDisplay.value = "⚠️ เชื่อมต่อไม่ได้"; }
    }

    function toggleCamera() {
        const reader = document.getElementById('reader');
        if (reader.style.display === 'block') {
            if(html5QrcodeScanner) { html5QrcodeScanner.clear(); html5QrcodeScanner = null; }
            reader.style.display = 'none';
        } else {
            reader.style.display = 'block';
            html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 20, qrbox: 250 });
            html5QrcodeScanner.render((text) => {
                document.getElementById('sku').value = text;
                document.getElementById('reader').style.display = 'none';
                html5QrcodeScanner.clear(); html5QrcodeScanner = null;
                searchProduct();
            });
        }
    }

    async function submitData() {
        if(!currentMode) { showToast("กรุณาเลือกโหมดก่อนครับ", "error"); return; }
        
        const userVal = document.getElementById('user').value.trim();
        if (!userVal) {
            showToast("⚠️ ระบุชื่อผู้ทำรายการก่อนครับ", "error");
            document.getElementById('user').focus();
            document.getElementById('user').style.borderColor = "red";
            return;
        } else {
            document.getElementById('user').style.borderColor = "#e0e0e0";
            localStorage.setItem('teenoi_user', userVal);
        }

        let finalSku = (currentMode === 'NEW') ? document.getElementById('new-sku').value.trim() : document.getElementById('sku').value.trim();
        const qtyVal = document.getElementById('qty').value;
        
        if(!finalSku) { showToast("ระบุรหัสสินค้า", "error"); return; }
        if(!qtyVal || Number(qtyVal) <= 0) { showToast("จำนวนต้องมากกว่า 0", "error"); return; }
        if(currentMode === 'NEW' && !document.getElementById('item-name').value.trim()) { showToast("ระบุชื่อสินค้า", "error"); return; }

        const btn = document.getElementById('btn-submit');
        const oldText = btn.innerText; 
        btn.innerText = "⏳..."; btn.disabled = true;

        const payload = {
            mode: currentMode, sku: finalSku, qty: qtyVal,
            unit: document.getElementById('unit').value,
            ratio: document.getElementById('new-ratio').value,
            name: document.getElementById('item-name').value,
            user: userVal,
            sap_unit: document.getElementById('new-sap-unit').value,
            barcode: document.getElementById('new-barcode').value,
            weight: document.getElementById('new-weight').value,
            detail: document.getElementById('new-detail').value
        };

        try {
            const response = await fetch(WEBHOOK_URL, {
                method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload)
            });
            const data = await response.json();

            if (data.status === 'error') { 
                showToast("❌ " + data.message, "error"); 
            } else if (data.status === 'error_log') {
                showToast("⚠️ " + data.message, "error");
            } else {
                // ✅ สำเร็จ!
                showToast("✅ " + data.message, "success");
                
                // Clear & Reset
                document.getElementById('sku').value = ""; 
                document.getElementById('new-sku').value = "";
                document.getElementById('item-name').value = ""; 
                document.getElementById('new-barcode').value = "";
                document.getElementById('new-weight').value = ""; 
                document.getElementById('new-detail').value = "";
                document.getElementById('name-display').value = "";
                document.getElementById('qty').value = "1";
                
                // Focus กลับไปที่ช่อง Scan
                document.getElementById('sku').focus();
            }
        } catch(e) { 
            showToast("Connection Error ⚠️", "error");
        } 
        finally { btn.innerText = oldText; btn.disabled = false; }
    }
</script>

</body>
</html>
