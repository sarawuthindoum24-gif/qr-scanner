<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการคลังสินค้า</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; padding: 20px; background-color: #f4f4f9; text-align: center; }
        h2 { color: #333; margin-bottom: 20px; }
        .controls { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 500px; margin: 0 auto 20px auto; }
        input, button { padding: 12px; margin: 5px; font-size: 16px; border-radius: 8px; border: 1px solid #ddd; width: 100%; box-sizing: border-box; }
        button { border: none; cursor: pointer; font-weight: bold; transition: 0.3s; }
        
        /* ปุ่มเลือกโหมด */
        .mode-switch { display: flex; gap: 10px; margin-bottom: 15px; }
        .mode-btn { flex: 1; background: #e0e0e0; color: #555; }
        #btn-in.active { background-color: #28a745; color: white; }
        #btn-out.active { background-color: #dc3545; color: white; }

        /* กล้อง */
        #reader { width: 100%; max-width: 500px; margin: 0 auto; border: 2px solid #eee; border-radius: 10px; }
        
        /* ผลลัพธ์ */
        .log { margin-top: 20px; font-size: 14px; text-align: left; background: #fff; padding: 15px; border-radius: 10px; max-width: 500px; margin-left: auto; margin-right: auto; }
        .success { color: green; border-left: 4px solid green; padding-left: 5px; margin-bottom: 5px;}
        .error { color: red; border-left: 4px solid red; padding-left: 5px; margin-bottom: 5px;}
    </style>
</head>
<body>

    <h2>📦 ระบบจัดการคลังสินค้า</h2>

    <div class="controls">
        <div class="mode-switch">
            <button id="btn-in" class="mode-btn active" onclick="setMode('IN')">รับเข้า (IN)</button>
            <button id="btn-out" class="mode-btn" onclick="setMode('OUT')">จ่ายออก (OUT)</button>
        </div>
        <input type="number" id="qty" value="1" placeholder="จำนวน">
        <input type="text" id="user" value="Admin" placeholder="ชื่อผู้ทำรายการ">
    </div>

    <div id="reader"></div>
    <p style="color:#777; margin-top:10px;">รองรับทั้ง QR Code และ Barcode</p>
    <div class="log" id="log">ระบบพร้อมทำงาน...</div>

    <script>
        // -------------------------------------------------------------
        // ⚠️⚠️ แก้ไข URL บรรทัดล่างนี้ ให้เป็นของคุณเอง (Production URL) ⚠️⚠️
        const WEBHOOK_URL = "https://YOUR-N8N-URL/webhook/scan-inventory"; 
        // -------------------------------------------------------------

        let currentMode = 'IN';
        let isProcessing = false;

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btn-in').className = mode === 'IN' ? 'mode-btn active' : 'mode-btn';
            document.getElementById('btn-out').className = mode === 'OUT' ? 'mode-btn active' : 'mode-btn';
        }

        function logMessage(msg, type = '') {
            const logDiv = document.getElementById('log');
            const time = new Date().toLocaleTimeString('th-TH');
            logDiv.innerHTML = `<div class="${type}"><b>[${time}]</b> ${msg}</div>` + logDiv.innerHTML;
        }

        async function onScanSuccess(decodedText, decodedResult) {
            if (isProcessing) return; 
            isProcessing = true;
            
            const qty = parseInt(document.getElementById('qty').value) || 1;
            const user = document.getElementById('user').value || 'Unknown';
            
            logMessage(`🔍 กำลังส่งข้อมูล: ${decodedText} (${qty} ชิ้น)...`);

            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ sku: decodedText, action: currentMode, qty: qty, user: user })
                });

                const result = await response.json();
                
                if (response.ok) {
                    logMessage(`✅ สำเร็จ: ${result.message || 'บันทึกแล้ว'}`, 'success');
                } else {
                    logMessage(`❌ ผิดพลาด: ${result.message}`, 'error');
                }

            } catch (error) {
                logMessage(`❌ เชื่อมต่อไม่ได้: ${error.message}`, 'error');
            }

            setTimeout(() => { isProcessing = false; }, 2500);
        }

        const html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
            fps: 10, qrbox: 250, 
            formatsToSupport: [ Html5QrcodeSupportedFormats.QR_CODE, Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.EAN_13 ]
        });
        html5QrcodeScanner.render(onScanSuccess
