<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการคลังแห้ง/สิ้นเปลือง</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        /* 🎨 THEME: Suki Teenoi Red & Gold */
        :root {
            --teenoi-red: #CE1126;       /* แดงหลัก */
            --teenoi-dark: #8B0000;      /* แดงเลือดหมู */
            --teenoi-gold: #FDB913;      /* เหลืองทอง */
            --bg-color: #FDF2F2;         /* พื้นหลังชมพูจางๆ */
        }

        body { 
            font-family: 'Sarabun', sans-serif; 
            background-color: var(--bg-color); 
            padding: 15px; 
            margin: 0; 
            text-align: center; 
            color: #333; 
        }
        
        .container { 
            background: white; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(206, 17, 38, 0.2); 
            max-width: 600px; 
            margin: 0 auto; 
            overflow: hidden;
            border: 1px solid #ffecec;
        }
        
        /* 🔥 HEADER: ดีไซน์ใหม่ แดงคาดทอง */
        .header-section { 
            background: linear-gradient(135deg, var(--teenoi-red) 0%, var(--teenoi-dark) 100%);
            padding: 30px 20px;
            color: white;
            border-bottom: 6px solid var(--teenoi-gold);
            position: relative;
        }
        
        /* เงาพื้นหลังเพื่อให้โลโก้เด่น */
        .header-section::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, rgba(255,255,255,0.1) 0%, transparent 70%);
            pointer-events: none;
        }
        
        .app-logo { 
            width: 130px; 
            height: 130px; 
            object-fit: contain; 
            margin-bottom: 12px; 
            background: white; 
            border-radius: 50%; 
            padding: 8px;
            border: 4px solid var(--teenoi-gold);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        
        h2 { 
            margin: 0; 
            font-size: 24px; 
            font-weight: 700; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            letter-spacing: 0.5px;
        }
        
        .content-body { padding: 25px 20px; }

        /* ปุ่มโหมด */
        .mode-container { display: flex; gap: 10px; margin-bottom: 25px; }
        .mode-btn { 
            flex: 1; padding: 12px; border-radius: 12px; 
            border: 2px solid #eee; font-weight: bold; cursor: pointer; 
            background: white; font-size: 14px; color: #666;
            transition: all 0.2s ease;
        }
        
        /* Active States (เน้นสีแดง) */
        .active-in { 
            background: #e8f5e9; border-color: #28a745; color: #155724; 
            transform: translateY(-2px); box-shadow: 0 4px 8px rgba(40,167,69,0.2);
        }
        .active-out { 
            background: #ffebee; border-color: var(--teenoi-red); color: var(--teenoi-red); 
            transform: translateY(-2px); box-shadow: 0 4px 8px rgba(206,17,38,0.2);
        }
        .active-new { 
            background: #e3f2fd; border-color: #007bff; color: #004085; 
            transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,123,255,0.2);
        }
        
        /* ฟอร์ม */
        input, select { 
            width: 100%; padding: 14px; margin: 8px 0; 
            border: 2px solid #eee; border-radius: 12px; 
            box-sizing: border-box; font-size: 16px; 
            background-color: #fafafa;
            transition: 0.3s;
        }
        input:focus, select:focus { 
            outline: none; border-color: var(--teenoi-red); 
            background-color: #fff; 
            box-shadow: 0 0 0 4px rgba(206,17,38,0.1);
        }

        .info-display { 
            background-color: #f8f9fa; border-color: #ddd; 
            color: #444; font-weight: bold; cursor: default;
        }
        .hidden { display: none !important; }
        
        .form-section { 
            background: #fff; border: 1px solid #f0f0f0;
            padding: 20px; border-radius: 15px; margin-bottom: 20px; 
            text-align: left; box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }
        .form-label { 
            font-weight: 700; font-size: 15px; 
            color: var(--teenoi-red); margin-top: 5px; display: block; 
        }
        
        #reader { 
            width: 100%; margin-bottom: 15px; border-radius: 15px; 
            overflow: hidden; display: none; background: #000; 
            border: 4px solid var(--teenoi-gold); 
        }
        
        /* ปุ่มยืนยัน (Main Button) */
        .btn-submit { 
            width: 100%; padding: 16px; font-size: 18px; color: white; 
            background: #ccc; border: none; border-radius: 12px; 
            cursor: not-allowed; margin-top: 15px; font-weight: 700; 
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
            transition: all 0.2s;
        }
        
        .ready-in { background: #28a745; box-shadow: 0 4px 0 #1e7e34; }
        .ready-out { background: var(--teenoi-red); box-shadow: 0 4px 0 #990d1c; } /* สีแดงตี๋น้อย */
        .ready-new { background: #007bff; box-shadow: 0 4px 0 #0056b3; }
        
        .btn-submit:active { transform: translateY(4px); box-shadow: none !important; }
        
        /* ปุ่มกล้อง */
        .camera-btn {
            width:100%; padding:12px; cursor:pointer; 
            background: #fff; color: var(--teenoi-red);
            border: 2px solid var(--teenoi-red); 
            border-radius: 12px; margin-bottom: 20px; font-weight: bold; font-size: 16px;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: 0.2s;
        }
        .camera-btn:hover { background: #fff5f5; transform: translateY(-2px); }

        #log { 
            margin-top: 25px; text-align: left; font-size: 14px; 
            max-height: 200px; overflow-y: auto; 
            border-top: 2px dashed #e0e0e0; padding-top: 15px; 
        }
        .log-item { padding: 8px 0; border-bottom: 1px solid #f9f9f9; }
    </style>
</head>
<body>

<div class="container">
    
    <div class="header-section">
        <img src="https://drive.google.com/thumbnail?id=1pJv1ltq9eVPWYabYWWub9S3fR4QC4UuE&sz=w400" 
             alt="Suki Teenoi" 
             class="app-logo">
        <h2>ระบบจัดการคลังแห้ง/สิ้นเปลือง</h2>
    </div>

    <div class="content-body">
        <div class="mode-container">
            <button class="mode-btn" onclick="setMode('IN')" id="btn-in">📥 รับเข้า</button>
            <button class="mode-btn" onclick="setMode('OUT')" id="btn-out">📤 จ่ายออก</button>
            <button class="mode-btn" onclick="setMode('NEW')" id="btn-new">✨ สินค้าใหม่</button>
        </div>

        <div id="group-scan">
            <div id="reader"></div>
            <button onclick="toggleCamera()" class="camera-btn">📷 เปิด/ปิด กล้อง</button>
            
            <div class="form-section">
                <span class="form-label">รหัสสินค้า (SKU):</span>
                <input type="text" id="sku" placeholder="สแกน หรือ พิมพ์..." onchange="searchProduct()">
                
                <span class="form-label" style="color:#666;">ชื่อสินค้า:</span>
                <input type="text" id="name-display" class="info-display" readonly placeholder="...">
            </div>
        </div>

        <div id="form-area" class="hidden">
            <div id="group-new" class="hidden">
                <div class="form-section">
                    <span class="form-label">1. ข้อมูลหลัก</span>
                    <input type="text" id="new-sku" placeholder="รหัสสินค้า (ItemCode)">
                    <input type="text" id="item-name" placeholder="ชื่อสินค้า (Description)">
                    <input type="text" id="new-barcode" placeholder="บาร์โค้ด (ถ้ามี)">
                </div>
                <div class="form-section">
                    <span class="form-label">2. หน่วยและการคำนวณ</span>
                    <div style="display:flex; gap:10px;">
                        <div style="flex:1;"><input type="number" id="new-ratio" placeholder="ตัวคูณ" value="1"></div>
                        <div style="flex:1;"><input type="text" id="new-sap-unit" placeholder="หน่วย SAP"></div>
                    </div>
                    <input type="text" id="new-detail" placeholder="รายละเอียดหน่วย">
                    <input type="number" id="new-weight" placeholder="น้ำหนัก (KG)">
                </div>
            </div>

            <div class="form-section">
                <span class="form-label">จำนวนและหน่วย (Stock):</span>
                <div style="display:flex; gap:10px;">
                    <div style="flex:1;"><input type="number" id="qty" value="1"></div>
                    <div style="flex:1;">
                        <select id="unit">
                            <option value="ลัง">ลัง</option>
                            <option value="ถุง">ถุง</option>
                            <option value="มัด">มัด</option>
                            <option value="กก.">กก.</option>
                            <option value="กระสอบ">กระสอบ</option>
                            <option value="แพ็ค">แพ็ค</option>
                            <option value="ขวด">ขวด</option>
                            <option value="แกลลอน">แกลลอน</option>
                            <option value="ชิ้น">ชิ้น</option>
                        </select>
                    </div>
                </div>
                <span class="form-label" style="margin-top:10px;">ผู้ทำรายการ:</span>
                <input type="text" id="user" value="Admin" placeholder="ระบุชื่อ">
            </div>

            <button id="btn-submit" class="btn-submit" onclick="submitData()">กรุณาเลือกโหมด</button>
        </div>
        
        <div id="log">📝 ประวัติการทำงาน...</div>
    </div>
</div>

<script>
    // 👇👇👇 ⚠️ อย่าลืมใส่ลิงก์ Web App URL ของคุณตรงนี้! ⚠️ 👇👇👇
    const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbz_XXXXXXXXXXXX/exec"; 
    // -------------------------------------------------------------

    let currentMode = null;
    let html5QrcodeScanner = null;

    function setMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.mode-btn').forEach(b => b.className = 'mode-btn');
        document.getElementById('btn-' + mode.toLowerCase()).classList.add('active-' + mode.toLowerCase());
        document.getElementById('form-area').classList.remove('hidden');

        if (mode === 'NEW') {
            document.getElementById('group-scan').classList.add('hidden');
            document.getElementById('group-new').classList.remove('hidden');
        } else {
            document.getElementById('group-scan').classList.remove('hidden');
            document.getElementById('group-new').classList.add('hidden');
        }

        const btn = document.getElementById('btn-submit');
        btn.className = `btn-submit ready-${mode.toLowerCase()}`;
        
        let txt = "";
        if(mode === 'IN') txt = 'ยืนยัน "รับเข้า (IN)"';
        else if(mode === 'OUT') txt = 'ยืนยัน "จ่ายออก (OUT)"';
        else txt = 'ยืนยัน "สินค้าใหม่"';
        
        btn.innerText = txt;
        btn.disabled = false;
    }

    async function searchProduct() {
        const sku = document.getElementById('sku').value.trim();
        if(!sku || currentMode === 'NEW') return;
        const nameDisplay = document.getElementById('name-display');
        nameDisplay.value = "🔍 กำลังค้นหา..."; nameDisplay.style.color = "orange";
        try {
            const response = await fetch(WEBHOOK_URL + "?mode=SEARCH&sku=" + encodeURIComponent(sku));
            const data = await response.json();
            if(data.status === 'success') {
                nameDisplay.value = data.name; nameDisplay.style.color = "#28a745"; 
                const unitSelect = document.getElementById('unit');
                let found = false;
                for(let i=0; i<unitSelect.options.length; i++){
                    if(unitSelect.options[i].value === data.unit) { unitSelect.selectedIndex = i; found = true; break; }
                }
                if(!found && data.unit) {
                    let opt = document.createElement('option'); opt.value = data.unit; opt.innerHTML = data.unit;
                    unitSelect.appendChild(opt); unitSelect.value = data.unit;
                }
            } else { nameDisplay.value = "❌ ไม่พบสินค้า"; nameDisplay.style.color = "red"; }
        } catch(e) { nameDisplay.value = "⚠️ เชื่อมต่อไม่ได้"; }
    }

    function toggleCamera() {
        const reader = document.getElementById('reader');
        if (reader.style.display === 'block') {
            if(html5QrcodeScanner) { html5QrcodeScanner.clear(); html5QrcodeScanner = null; }
            reader.style.display = 'none';
        } else {
            reader.style.display = 'block';
            html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
            html5QrcodeScanner.render((text) => {
                document.getElementById('sku').value = text;
                document.getElementById('reader').style.display = 'none';
                html5QrcodeScanner.clear(); html5QrcodeScanner = null;
                searchProduct();
            });
        }
    }

    async function submitData() {
        if(!currentMode) { alert("กรุณาเลือกโหมด"); return; }
        let finalSku = (currentMode === 'NEW') ? document.getElementById('new-sku').value.trim() : document.getElementById('sku').value.trim();
        const qtyVal = document.getElementById('qty').value;
        
        if(!finalSku) { alert("กรุณาระบุรหัสสินค้า"); return; }
        if(!qtyVal || Number(qtyVal) <= 0) { alert("จำนวนต้องมากกว่า 0"); return; }
        if(currentMode === 'NEW' && !document.getElementById('item-name').value.trim()) { alert("กรุณาระบุชื่อสินค้า"); return; }

        const btn = document.getElementById('btn-submit');
        const oldText = btn.innerText; btn.innerText = "⏳ กำลังบันทึก..."; btn.disabled = true;

        const payload = {
            mode: currentMode, sku: finalSku, qty: qtyVal,
            unit: document.getElementById('unit').value,
            ratio: document.getElementById('new-ratio').value,
            name: document.getElementById('item-name').value,
            user: document.getElementById('user').value,
            sap_unit: document.getElementById('new-sap-unit').value,
            barcode: document.getElementById('new-barcode').value,
            weight: document.getElementById('new-weight').value,
            detail: document.getElementById('new-detail').value
        };

        try {
            const response = await fetch(WEBHOOK_URL, {
                method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload)
            });
            const data = await response.json();
            const logDiv = document.getElementById('log');
            const time = new Date().toLocaleTimeString('th-TH', {hour: '2-digit', minute:'2-digit'});

            if (data.status === 'error') { alert("❌ " + data.message); } 
            else if (data.status === 'error_log') {
                alert("❌ " + data.message);
                logDiv.innerHTML = `<div class="log-item" style="color:red; font-weight:bold;">[${time}] ❌ ${data.message}</div>` + logDiv.innerHTML;
            } else {
                alert("✅ " + data.message);
                let color = currentMode === 'IN' ? '#28a745' : (currentMode === 'OUT' ? '#CE1126' : '#007bff');
                logDiv.innerHTML = `<div class="log-item" style="color:${color}; font-weight:bold;">[${time}] ✅ ${data.message}</div>` + logDiv.innerHTML;
                
                document.getElementById('sku').value = ""; document.getElementById('new-sku').value = "";
                document.getElementById('item-name').value = ""; document.getElementById('new-barcode').value = "";
                document.getElementById('new-weight').value = ""; document.getElementById('new-detail').value = "";
                document.getElementById('name-display').value = "";
            }
        } catch(e) { alert("Connection Error"); } 
        finally { btn.innerText = oldText; btn.disabled = false; }
    }
</script>

</body>
</html>
