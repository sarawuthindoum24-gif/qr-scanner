<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบจัดการคลัง</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        /* 🎨 THEME: Suki Teenoi Red & Gold */
        :root {
            --teenoi-red: #CE1126;
            --teenoi-dark: #8B0000;
            --teenoi-gold: #FDB913;
            --bg-color: #f8f0f0;
        }

        body { 
            font-family: 'Sarabun', sans-serif; 
            background-color: var(--bg-color); 
            padding: 10px; margin: 0; text-align: center; color: #333; 
            height: 100vh; box-sizing: border-box;
        }
        
        .container { 
            background: white; border-radius: 15px; 
            box-shadow: 0 5px 15px rgba(206, 17, 38, 0.15); 
            max-width: 550px; margin: 0 auto; overflow: hidden;
            border: 1px solid #ffecec;
            display: flex; flex-direction: column;
            max-height: calc(100vh - 20px);
        }
        
        /* HEADER */
        .header-section { 
            background: linear-gradient(135deg, var(--teenoi-red) 0%, var(--teenoi-dark) 100%);
            padding: 12px 15px; color: white;
            border-bottom: 4px solid var(--teenoi-gold);
            display: flex; align-items: center; gap: 10px;
            flex-shrink: 0; text-align: left;
        }
        
        .app-logo { 
            width: 55px; height: 55px; object-fit: contain; 
            background: white; border-radius: 50%; padding: 3px;
            border: 2px solid var(--teenoi-gold);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            flex-shrink: 0;
        }
        
        .header-title { flex-grow: 1; text-align: center; overflow: hidden; }

        h2 { 
            margin: 0; font-size: 20px; font-weight: 700; 
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        
        .content-body { padding: 15px; overflow-y: auto; flex-grow: 1; }

        .mode-container { display: flex; gap: 8px; margin-bottom: 15px; }
        .mode-btn { 
            flex: 1; padding: 10px 5px; border-radius: 10px;
            border: 2px solid #eee; font-weight: bold; cursor: pointer; 
            background: white; font-size: 14px; color: #666;
            transition: all 0.2s ease;
        }
        
        .active-in { background: #e8f5e9; border-color: #28a745; color: #155724; }
        .active-out { background: #ffebee; border-color: var(--teenoi-red); color: var(--teenoi-red); }
        .active-new { background: #e3f2fd; border-color: #007bff; color: #004085; }
        
        input, select { 
            width: 100%; padding: 10px; margin: 4px 0; 
            border: 2px solid #eee; border-radius: 8px; 
            box-sizing: border-box; font-size: 15px; background-color: #fafafa;
        }
        input:focus, select:focus { outline: none; border-color: var(--teenoi-red); background-color: #fff; }

        /* Placeholder สีเทา */
        ::placeholder { color: #aaa; opacity: 1; }

        .info-display { background-color: #f8f9fa; border-color: #ddd; color: #444; font-weight: bold; }
        .hidden { display: none !important; }
        
        .form-section { 
            background: #fff; border: 1px solid #f0f0f0;
            padding: 12px; border-radius: 12px; margin-bottom: 12px; 
            text-align: left; box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }
        .form-label { font-weight: 700; font-size: 14px; color: var(--teenoi-red); margin-bottom: 2px; display: block; }
        .flex-row { display: flex; gap: 8px; } .flex-row > * { flex: 1; }

        #reader { width: 100%; margin-bottom: 10px; border-radius: 12px; overflow: hidden; display: none; background: #000; border: 3px solid var(--teenoi-gold); }
        
        .btn-submit { 
            width: 100%; padding: 14px; font-size: 18px; color: white; 
            background: #ccc; border: none; border-radius: 12px; 
            cursor: not-allowed; margin-top: 10px; font-weight: 700; 
            box-shadow: 0 4px 0 rgba(0,0,0,0.1); flex-shrink: 0;
        }
        
        .ready-in { background: #28a745; box-shadow: 0 3px 0 #1e7e34; }
        .ready-out { background: var(--teenoi-red); box-shadow: 0 3px 0 #990d1c; }
        .ready-new { background: #007bff; box-shadow: 0 3px 0 #0056b3; }
        .btn-submit:active { transform: translateY(3px); box-shadow: none !important; }
        
        .camera-btn {
            width:100%; padding: 8px; cursor:pointer; background: #fff; color: var(--teenoi-red);
            border: 2px solid var(--teenoi-red); border-radius: 10px; margin-bottom: 15px; font-weight: bold; font-size: 14px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }

        #log { margin-top: 15px; text-align: left; font-size: 12px; max-height: 80px; overflow-y: auto; border-top: 1px dashed #e0e0e0; padding-top: 8px; color: #777; }
        .log-item { padding: 4px 0; border-bottom: 1px solid #f9f9f9; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/38/Suki_Teenoi_Logo.png/600px-Suki_Teenoi_Logo.png" 
             alt="Suki Teenoi" 
             class="app-logo"
             onerror="this.onerror=null; this.src='https://drive.google.com/thumbnail?id=1pJv1ltq9eVPWYabYWWub9S3fR4QC4UuE&sz=w200';">
        
        <div class="header-title">
            <h2>ระบบจัดการคลังแห้ง/สิ้นเปลือง</h2>
        </div>
        <div style="width: 55px;"></div>
    </div>

    <div class="content-body">
        <div class="mode-container">
            <button class="mode-btn" onclick="setMode('IN')" id="btn-in">📥 รับเข้า</button>
            <button class="mode-btn" onclick="setMode('OUT')" id="btn-out">📤 จ่ายออก</button>
            <button class="mode-btn" onclick="setMode('NEW')" id="btn-new">✨ สินค้าใหม่</button>
        </div>

        <div id="group-scan">
            <div id="reader"></div>
            <button onclick="toggleCamera()" class="camera-btn">📷 เปิด/ปิด กล้อง</button>
            
            <div class="form-section">
                <span class="form-label">Scan SKU:</span>
                <input type="text" id="sku" placeholder="สแกน หรือ พิมพ์รหัส..." onchange="searchProduct()" style="font-weight: bold;">
                <input type="text" id="name-display" class="info-display" readonly placeholder="ชื่อสินค้าจะปรากฏที่นี่...">
            </div>
        </div>

        <div id="form-area" class="hidden">
            <div id="group-new" class="hidden">
                <div class="form-section">
                   <span class="form-label" style="margin-bottom: 8px;">ข้อมูลสินค้าใหม่:</span>
                   <div class="flex-row">
                       <input type="text" id="new-sku" placeholder="รหัสสินค้า (ItemCode)">
                       <input type="text" id="new-barcode" placeholder="บาร์โค้ด (ถ้ามี)">
                   </div>
                   <input type="text" id="item-name" placeholder="ชื่อสินค้า (Description)">
                   <div style="margin-top: 4px;">
                       <span class="form-label" style="font-size: 12px;">การแปลงหน่วย:</span>
                       <div class="flex-row">
                            <input type="number" id="new-ratio" placeholder="ตัวคูณ (เช่น 12)" value="1">
                            <input type="text" id="new-sap-unit" placeholder="หน่วย SAP (เช่น ขวด)">
                       </div>
                   </div>
                   <div class="flex-row">
                        <input type="text" id="new-detail" placeholder="รายละเอียด">
                        <input type="number" id="new-weight" placeholder="น้ำหนัก (KG)">
                   </div>
                </div>
            </div>

            <div class="form-section" style="background-color: #fff8f8; border-color: #ffecec;">
                <div class="flex-row">
                    <div style="flex: 1;">
                        <span class="form-label">จำนวน:</span>
                        <input type="number" id="qty" value="1" style="font-size: 18px; font-weight: bold; text-align: center;">
                    </div>
                    <div style="flex: 1.5;">
                        <span class="form-label">หน่วยนับ:</span>
                        <select id="unit" style="font-size: 16px;">
                            <option value="ลัง">ลัง</option>
                            <option value="ถุง">ถุง</option>
                            <option value="มัด">มัด</option>
                            <option value="กก.">กก.</option>
                            <option value="กระสอบ">กระสอบ</option>
                            <option value="แพ็ค">แพ็ค</option>
                            <option value="ขวด">ขวด</option>
                            <option value="แกลลอน">แกลลอน</option>
                            <option value="ชิ้น">ชิ้น</option>
                        </select>
                    </div>
                </div>
                <div style="margin-top: 8px;">
                    <input type="text" id="user" value="" placeholder="ระบุชื่อผู้ทำรายการ (จำเป็น)..." style="text-align: center; background: #fff; border: 2px solid #ddd;">
                </div>
            </div>

            <button id="btn-submit" class="btn-submit" onclick="submitData()">เลือกโหมดก่อน</button>
        </div>
        
        <div id="log">📝 ประวัติ...</div>
    </div>
</div>

<script>
    // 👇👇👇 ⚠️ อย่าลืมใส่ลิงก์ Web App URL ตรงนี้ (เช็คให้ชัวร์นะครับ) ⚠️ 👇👇👇
    const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbz0QnI98PipL0MTXFDqPzpEgzOc9oLl8mjA4NezLLS0oQZvBFl_b7SLaLgc_PtKsDHw/exec"; 
    // -------------------------------------------------------------

    let currentMode = null;
    let html5QrcodeScanner = null;

    function setMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.mode-btn').forEach(b => b.className = 'mode-btn');
        document.getElementById('btn-' + mode.toLowerCase()).classList.add('active-' + mode.toLowerCase());
        document.getElementById('form-area').classList.remove('hidden');

        if (mode === 'NEW') {
            document.getElementById('group-scan').classList.add('hidden');
            document.getElementById('group-new').classList.remove('hidden');
        } else {
            document.getElementById('group-scan').classList.remove('hidden');
            document.getElementById('group-new').classList.add('hidden');
        }

        const btn = document.getElementById('btn-submit');
        btn.className = `btn-submit ready-${mode.toLowerCase()}`;
        
        let txt = "";
        if(mode === 'IN') txt = '✅ ยืนยัน "รับเข้า"';
        else if(mode === 'OUT') txt = '✅ ยืนยัน "จ่ายออก"';
        else txt = '✨ ยืนยัน "สร้างสินค้าใหม่"';
        
        btn.innerText = txt;
        btn.disabled = false;
    }

    async function searchProduct() {
        const sku = document.getElementById('sku').value.trim();
        if(!sku || currentMode === 'NEW') return;
        const nameDisplay = document.getElementById('name-display');
        nameDisplay.value = "🔍..."; nameDisplay.style.color = "orange";
        try {
            const response = await fetch(WEBHOOK_URL + "?mode=SEARCH&sku=" + encodeURIComponent(sku));
            const data = await response.json();
            if(data.status === 'success') {
                nameDisplay.value = data.name; nameDisplay.style.color = "#28a745"; 
                const unitSelect = document.getElementById('unit');
                let found = false;
                for(let i=0; i<unitSelect.options.length; i++){
                    if(unitSelect.options[i].value === data.unit) { unitSelect.selectedIndex = i; found = true; break; }
                }
                if(!found && data.unit) {
                    let opt = document.createElement('option'); opt.value = data.unit; opt.innerHTML = data.unit;
                    unitSelect.appendChild(opt); unitSelect.value = data.unit;
                }
            } else { nameDisplay.value = "❌ ไม่พบสินค้า"; nameDisplay.style.color = "red"; }
        } catch(e) { nameDisplay.value = "⚠️ เชื่อมต่อไม่ได้"; }
    }

    function toggleCamera() {
        const reader = document.getElementById('reader');
        if (reader.style.display === 'block') {
            if(html5QrcodeScanner) { html5QrcodeScanner.clear(); html5QrcodeScanner = null; }
            reader.style.display = 'none';
        } else {
            reader.style.display = 'block';
            html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
            html5QrcodeScanner.render((text) => {
                document.getElementById('sku').value = text;
                document.getElementById('reader').style.display = 'none';
                html5QrcodeScanner.clear(); html5QrcodeScanner = null;
                searchProduct();
            });
        }
    }

    async function submitData() {
        if(!currentMode) { alert("กรุณาเลือกโหมด"); return; }
        
        // 🔥 VALIDATION: ตรวจสอบชื่อผู้ทำรายการ
        const userVal = document.getElementById('user').value.trim();
        if (!userVal) {
            alert("⚠️ กรุณาระบุ 'ชื่อผู้ทำรายการ' ก่อนยืนยันครับ!");
            document.getElementById('user').focus(); // โฟกัสไปที่ช่องชื่อ
            document.getElementById('user').style.borderColor = "red"; // เปลี่ยนขอบเป็นสีแดงเตือน
            return; // หยุดการทำงาน ไม่ส่งข้อมูล
        } else {
            document.getElementById('user').style.borderColor = "#ddd"; // คืนค่าสีขอบ
        }

        let finalSku = (currentMode === 'NEW') ? document.getElementById('new-sku').value.trim() : document.getElementById('sku').value.trim();
        const qtyVal = document.getElementById('qty').value;
        
        if(!finalSku) { alert("กรุณาระบุรหัสสินค้า"); return; }
        if(!qtyVal || Number(qtyVal) <= 0) { alert("จำนวนต้องมากกว่า 0"); return; }
        if(currentMode === 'NEW' && !document.getElementById('item-name').value.trim()) { alert("กรุณาระบุชื่อสินค้า"); return; }

        const btn = document.getElementById('btn-submit');
        const oldText = btn.innerText; btn.innerText = "⏳..."; btn.disabled = true;

        const payload = {
            mode: currentMode, sku: finalSku, qty: qtyVal,
            unit: document.getElementById('unit').value,
            ratio: document.getElementById('new-ratio').value,
            name: document.getElementById('item-name').value,
            user: userVal, // ส่งค่าชื่อที่กรอกไป
            sap_unit: document.getElementById('new-sap-unit').value,
            barcode: document.getElementById('new-barcode').value,
            weight: document.getElementById('new-weight').value,
            detail: document.getElementById('new-detail').value
        };

        try {
            const response = await fetch(WEBHOOK_URL, {
                method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload)
            });
            const data = await response.json();
            const logDiv = document.getElementById('log');
            const time = new Date().toLocaleTimeString('th-TH', {hour: '2-digit', minute:'2-digit'});

            if (data.status === 'error') { alert("❌ " + data.message); } 
            else if (data.status === 'error_log') {
                alert("❌ " + data.message);
                logDiv.innerHTML = `<div class="log-item" style="color:red;">[${time}] ❌ ${data.message}</div>` + logDiv.innerHTML;
            } else {
                alert("✅ " + data.message);
                let color = currentMode === 'IN' ? '#28a745' : (currentMode === 'OUT' ? '#CE1126' : '#007bff');
                logDiv.innerHTML = `<div class="log-item" style="color:${color};">[${time}] ✅ ${data.message}</div>` + logDiv.innerHTML;
                
                document.getElementById('sku').value = ""; document.getElementById('new-sku').value = "";
                document.getElementById('item-name').value = ""; document.getElementById('new-barcode').value = "";
                document.getElementById('new-weight').value = ""; document.getElementById('new-detail').value = "";
                document.getElementById('name-display').value = "";
            }
        } catch(e) { 
            alert("Connection Error: กรุณาเช็ค Web App URL หรือ Internet"); 
        } 
        finally { btn.innerText = oldText; btn.disabled = false; }
    }
</script>

</body>
</html>
