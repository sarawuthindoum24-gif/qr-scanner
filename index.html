<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการคลังแห้ง/สิ้นเปลือง</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        /* 🎨 THEME SETTING: สุกี้ตี๋น้อย */
        :root {
            --teenoi-red: #b30000;       /* สีแดงเข้ม */
            --teenoi-red-light: #d90000; /* สีแดงสด */
            --teenoi-gold: #ffcc00;      /* สีทอง */
            --bg-color: #fff5f5;         /* พื้นหลังอมชมพูจางๆ */
        }

        body { font-family: 'Sarabun', sans-serif; background-color: var(--bg-color); padding: 15px; margin: 0; text-align: center; color: #333; }
        
        .container { 
            background: white; 
            border-radius: 20px; 
            box-shadow: 0 8px 20px rgba(179, 0, 0, 0.15); 
            max-width: 600px; 
            margin: 0 auto; 
            overflow: hidden; /* ตัดขอบมน */
        }
        
        /* 🔥 HEADER ดีไซน์ใหม่ */
        .header-section { 
            background: linear-gradient(180deg, var(--teenoi-red) 0%, var(--teenoi-red-light) 100%);
            padding: 25px 15px;
            color: white;
            border-bottom: 5px solid var(--teenoi-gold); /* ขอบทองด้านล่าง */
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .app-logo { 
            width: 140px; 
            height: auto; 
            margin-bottom: 10px; 
            background: white; 
            border-radius: 50%; 
            padding: 5px;
            border: 3px solid var(--teenoi-gold);
        }
        
        h2 { margin: 0; font-size: 22px; font-weight: bold; text-shadow: 1px 1px 2px rgba(0,0,0,0.2); }
        
        /* BODY */
        .content-body { padding: 20px; }

        /* ปุ่มเลือกโหมด */
        .mode-container { display: flex; gap: 8px; margin-bottom: 20px; }
        .mode-btn { 
            flex: 1; padding: 12px 5px; border-radius: 12px; 
            border: 1px solid #ddd; font-weight: bold; cursor: pointer; 
            background: white; font-size: 14px; color: #666;
            transition: all 0.2s;
        }
