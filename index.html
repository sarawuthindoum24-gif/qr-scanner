<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบคลังสินค้า (Final)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f4f6f8; padding: 20px; text-align: center; }
        .container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 600px; margin: 0 auto; }
        h2 { color: #333; margin-top: 0; }
        .mode-btn { width: 30%; padding: 15px; margin: 5px; border-radius: 8px; border: 2px solid #ddd; font-weight: bold; cursor: pointer; background: white; }
        .active-in { background: #d4edda; border-color: #28a745; color: #155724; }
        .active-out { background: #f8d7da; border-color: #dc3545; color: #721c24; }
        .active-new { background: #cce5ff; border-color: #004085; color: #004085; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .hidden { display: none; }
        #reader { width: 100%; margin-bottom: 10px; border-radius: 8px; display: none; }
        .btn-submit { width: 100%; padding: 15px; font-size: 18px; color: white; background: #999; border: none; border-radius: 8px; cursor: not-allowed; pointer-events: none; margin-top: 15px; }
        .ready { background: #28a745; cursor: pointer; pointer-events: auto; }
        .ready-out { background: #dc3545; }
        .ready-new { background: #007bff; }
    </style>
</head>
<body>

<div class="container">
    <h2>📦 ระบบจัดการสต็อก</h2>

    <div>
        <button class="mode-btn" onclick="setMode('IN')" id="btn-in">📥 รับเข้า</button>
        <button class="mode-btn" onclick="setMode('OUT')" id="btn-out">📤 จ่ายออก</button>
        <button class="mode-btn" onclick="setMode('NEW')" id="btn-new">✨ เพิ่มใหม่</button>
    </div>

    <div id="reader"></div>
    <button onclick="toggleCamera()" style="margin:10px 0; padding:8px; width:100%; cursor:pointer;">📷 เปิด/ปิด กล้อง</button>

    <div id="form-area" class="hidden">
        <label style="display:block; text-align:left;">รหัสสินค้า (SKU/ชื่อ):</label>
        <input type="text" id="sku" placeholder="สแกนหรือพิมพ์ชื่อสินค้า...">

        <div id="new-item-fields" class="hidden">
            <input type="text" id="item-name" placeholder="ชื่อสินค้า (เช่น แป้งโกกิ)">
            <input type="number" id="ratio" placeholder="จำนวนย่อยต่อหน่วย (Conversion)" value="1">
        </div>

        <div style="display:flex; gap:10px;">
            <div style="flex:1;">
                <label style="display:block; text-align:left;">จำนวน:</label>
                <input type="number" id="qty" value="1">
            </div>
            <div style="flex:1;">
                <label style="display:block; text-align:left;">หน่วย:</label>
                <select id="unit">
                    <option value="ชิ้น">ชิ้น</option>
                    <option value="ลัง">ลัง</option>
                    <option value="ถุง">ถุง</option>
                    <option value="กก.">กก.</option>
                    <option value="กระสอบ">กระสอบ</option>
                </select>
            </div>
        </div>

        <label style="display:block; text-align:left; margin-top:10px;">ผู้ทำรายการ:</label>
        <input type="text" id="user" value="Admin" style="background:#f9f9f9; font-weight:bold;">

        <button id="btn-submit" class="btn-submit" onclick="submitData()">กรุณาเลือกโหมด</button>
    </div>
    
    <div id="log" style="margin-top:20px; font-size:12px; color:#666;"></div>
</div>

<script>
    // 👇👇👇 วางลิงก์ใหม่ของคุณตรงนี้เท่านั้น 👇👇👇
    const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbw3Rh3SMAshSk9moN4P2yvRdlaeE66zLG-TbjsB_NwyYB-ACphTs24l9mGVgZCJeTp1/exec"; 
    // -----------------------------------------------------

    let currentMode = null;
    let html5QrcodeScanner = null;

    function setMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.mode-btn').forEach(b => b.className = 'mode-btn');
        document.getElementById('btn-' + mode.toLowerCase()).classList.add('active-' + mode.toLowerCase());
        
        document.getElementById('form-area').classList.remove('hidden');
        document.getElementById('new-item-fields').className = mode === 'NEW' ? '' : 'hidden';

        const btn = document.getElementById('btn-submit');
        btn.className = `btn-submit ready ready-${mode.toLowerCase()}`;
        btn.innerText = `ยืนยัน ${mode}`;
    }

    function toggleCamera() {
        const reader = document.getElementById('reader');
        if (reader.style.display === 'block') {
            if(html5QrcodeScanner) { html5QrcodeScanner.clear(); html5QrcodeScanner = null; }
            reader.style.display = 'none';
        } else {
            reader.style.display = 'block';
            html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
            html5QrcodeScanner.render((text) => {
                document.getElementById('sku').value = text;
                alert("สแกนแล้ว: " + text);
            });
        }
    }

    async function submitData() {
        if(!currentMode) return;
        
        const btn = document.getElementById('btn-submit');
        const oldText = btn.innerText;
        btn.innerText = "กำลังบันทึก...";
        btn.style.opacity = 0.5;

        // ⚠️ รวบรวมข้อมูลส่งไปหลังบ้าน
        const payload = {
            mode: currentMode,
            sku: document.getElementById('sku').value,
            qty: document.getElementById('qty').value,
            unit: document.getElementById('unit').value,
            ratio: document.getElementById('ratio').value,
            name: document.getElementById('item-name').value,
            user: document.getElementById('user').value // <--- บรรทัดนี้สำคัญมาก! ถ้าไม่มี ชื่อจะไม่ไป
        };

        try {
            await fetch(WEBHOOK_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            
            document.getElementById('log').innerHTML = `✅ บันทึก ${payload.sku} เรียบร้อย`;
            document.getElementById('sku').value = "";
            document.getElementById('qty').value = "1";
        } catch(e) {
            alert("Error: " + e.message);
        }
        
        btn.innerText = oldText;
        btn.style.opacity = 1;
    }
</script>

</body>
</html>
