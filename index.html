<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบคลังสินค้า (Debug Mode)</title>

        body { font-family: 'Sarabun', sans-serif; padding: 20px; background-color: #f0f2f5; text-align: center; color: #333; }

        .mode-group { display: flex; gap: 8px; margin-bottom: 15px; }
        .mode-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; background: #e4e6eb; color: #666; }

        #btn-out.active { background-color: #dc3545; color: white; }

        .form-group { text-align: left; margin-bottom: 12px; }
        label { font-size: 14px; font-weight: bold; display: block; margin-bottom: 4px; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        
        .btn-submit { width: 100%; padding: 14px; background-color: #007bff; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-submit:active { transform: scale(0.98); background-color: #0056b3; }
