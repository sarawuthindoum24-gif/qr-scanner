<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการสต็อก</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f0f2f5; padding: 10px; margin: 0; text-align: center; color: #333; }
        .container { background: white; padding: 15px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); max-width: 600px; margin: 0 auto; }
        h2 { margin-top: 0; color: #444; font-size: 20px; }
        
        .mode-container { display: flex; gap: 8px; margin-bottom: 15px; }
        .mode-btn { flex: 1; padding: 10px; border-radius: 8px; border: 2px solid #e0e0e0; font-weight: bold; cursor: pointer; background: white; font-size: 14px; }
        .active-in { background: #d4edda; border-color: #28a745; color: #155724; }
        .active-out { background: #f8d7da; border-color: #dc3545; color: #721c24; }
        .active-new { background: #cce5ff; border-color: #004085; color: #004085; }
        
        input, select { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        .info-display { background-color: #e9ecef; border: 1px solid #ced4da; color: #495057; font-weight: bold; cursor: not-allowed; }
        .hidden { display: none !important; }
        
        /* จัดกลุ่มฟอร์ม */
        .form-section { background: #f9f9f9; padding: 10px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #eee; text-align: left; }
        .form-label { font-weight: bold; font-size: 14px; color: #555; margin-top: 5px; display: block; }
        
        #reader { width: 100%; margin-bottom: 10px; border-radius: 10px; overflow: hidden; display: none; background: #000; }
        
        .btn-submit { width: 100%; padding: 12px; font-size: 18px; color: white; background: #999; border: none; border-radius: 10px; cursor: not-allowed; margin-top: 10px; font-weight: bold; }
        .ready-in { background: #28a745; cursor: pointer; }
        .ready-out { background: #dc3545; cursor: pointer; }
        .ready-new { background: #007bff; cursor: pointer; }
        
        #log { margin-top: 15px; text-align: left; font-size: 13px; max-height: 150px; overflow-y: auto; border-top: 1px solid #eee; padding-top: 5px; }
        .log-item { padding: 4px 0; border-bottom: 1px solid #f0f0f0; }
    </style>
</head>
<body>

<div class="container">
    <h2>🏭 จัดการคลังสินค้า</h2>

    <div class="mode-container">
        <button class="mode-btn" onclick="setMode('IN')" id="btn-in">📥 รับเข้า</button>
        <button class="mode-btn" onclick="setMode('OUT')" id="btn-out">📤 จ่ายออก</button>
        <button class="mode-btn" onclick="setMode('NEW')" id="btn-new">✨ สินค้าใหม่</button>
    </div>

    <div id="group-scan">
        <div id="reader"></div>
        <button onclick="toggleCamera()" style="width:100%; padding:8px; cursor:pointer; background:#f8f9fa; border:1px solid #ddd; border-radius:8px; margin-bottom:10px;">📷 เปิด/ปิด กล้อง</button>
        
        <span class="form-label">รหัสสินค้า (SKU):</span>
        <input type="text" id="sku" placeholder="สแกน หรือ พิมพ์..." onchange="searchProduct()">
        
        <span class="form-label" style="color:#007bff;">ชื่อสินค้า:</span>
        <input type="text" id="name-display" class="info-display" readonly placeholder="...">
    </div>

    <div id="form-area" class="hidden">
        
        <div id="group-new" class="hidden">
            <div class="form-section">
                <span class="form-label" style="color:#004085;">1. ข้อมูลหลัก</span>
                <input type="text" id="new-sku" placeholder="รหัสสินค้า (ItemCode)">
                <input type="text" id="item-name" placeholder="ชื่อสินค้า (Description)">
                <input type="text" id="new-barcode" placeholder="บาร์โค้ด (ถ้ามี)">
            </div>
            
            <div class="form-section">
                <span class="form-label" style="color:#004085;">2. หน่วยและการคำนวณ</span>
                <div style="display:flex; gap:5px;">
                    <div style="flex:1;">
                        <input type="number" id="new-ratio" placeholder="ตัวคูณ (Convert)" value="1">
                    </div>
                    <div style="flex:1;">
                        <input type="text" id="new-sap-unit" placeholder="หน่วย SAP (เช่น กก.)">
                    </div>
                </div>
                <input type="text" id="new-detail" placeholder="รายละเอียดหน่วย (เช่น ลัง/10ถุง)">
                <input type="number" id="new-weight" placeholder="น้ำหนัก (KG)">
            </div>
        </div>

        <div class="form-section">
            <span class="form-label">จำนวนและหน่วย (Stock):</span>
            <div style="display:flex; gap:5px;">
                <div style="flex:1;">
                    <input type="number" id="qty" value="1">
                </div>
                <div style="flex:1;">
                    <select id="unit">
                        <option value="ลัง">ลัง</option>
                        <option value="ถุง">ถุง</option>
                        <option value="มัด">มัด</option>
                        <option value="กก.">กก.</option>
                        <option value="กระสอบ">กระสอบ</option>
                        <option value="แพ็ค">แพ็ค</option>
                        <option value="ขวด">ขวด</option>
                        <option value="แกลลอน">แกลลอน</option>
                        <option value="ชิ้น">ชิ้น</option>
                    </select>
                </div>
            </div>
        </div>

        <span class="form-label">ผู้ทำรายการ:</span>
        <input type="text" id="user" value="Admin" placeholder="ระบุชื่อ">

        <button id="btn-submit" class="btn-submit" onclick="submitData()">กรุณาเลือกโหมด</button>
    </div>
    
    <div id="log">📝 ประวัติการทำงาน...</div>
</div>

<script>
    // 👇👇👇 ใส่ลิงก์ Web App URL ใหม่ตรงนี้ 👇👇👇
    const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbwhad7vcCvx77zUAWbeLhCd753ybt5hEzm9cl9PN6ap45kK9CRW6hH3Drt5PPUUPlfb/exec"; 
    // -----------------------------------------------------

    let currentMode = null;
    let html5QrcodeScanner = null;

    function setMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.mode-btn').forEach(b => b.className = 'mode-btn');
        document.getElementById('btn-' + mode.toLowerCase()).classList.add('active-' + mode.toLowerCase());
        
        document.getElementById('form-area').classList.remove('hidden');

        if (mode === 'NEW') {
            document.getElementById('group-scan').classList.add('hidden');
            document.getElementById('group-new').classList.remove('hidden');
        } else {
            document.getElementById('group-scan').classList.remove('hidden');
            document.getElementById('group-new').classList.add('hidden');
        }

        const btn = document.getElementById('btn-submit');
        btn.className = `btn-submit ready-${mode.toLowerCase()}`;
        let txt = mode==='IN'?'รับเข้า (IN)':(mode==='OUT'?'จ่ายออก (OUT)':'ยืนยันสินค้าใหม่');
        btn.innerText = `ยืนยัน "${txt}"`;
        btn.disabled = false;
    }

    async function searchProduct() {
        const sku = document.getElementById('sku').value.trim();
        if(!sku || currentMode === 'NEW') return;

        const nameDisplay = document.getElementById('name-display');
        nameDisplay.value = "🔍...";
        nameDisplay.style.color = "orange";

        try {
            const response = await fetch(WEBHOOK_URL + "?mode=SEARCH&sku=" + encodeURIComponent(sku));
            const data = await response.json();

            if(data.status === 'success') {
                nameDisplay.value = data.name;
                nameDisplay.style.color = "green";
                const unitSelect = document.getElementById('unit');
                let found = false;
                for(let i=0; i<unitSelect.options.length; i++){
                    if(unitSelect.options[i].value === data.unit) {
                        unitSelect.selectedIndex = i;
                        found = true;
                        break;
                    }
                }
                if(!found && data.unit) {
                    let opt = document.createElement('option');
                    opt.value = data.unit; opt.innerHTML = data.unit;
                    unitSelect.appendChild(opt); unitSelect.value = data.unit;
                }
            } else {
                nameDisplay.value = "❌ ไม่พบ";
                nameDisplay.style.color = "red";
            }
        } catch(e) { nameDisplay.value = "⚠️ Error"; }
    }

    function toggleCamera() {
        const reader = document.getElementById('reader');
        if (reader.style.display === 'block') {
            if(html5QrcodeScanner) { html5QrcodeScanner.clear(); html5QrcodeScanner = null; }
            reader.style.display = 'none';
        } else {
            reader.style.display = 'block';
            html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
            html5QrcodeScanner.render((text) => {
                document.getElementById('sku').value = text;
                document.getElementById('reader').style.display = 'none';
                html5QrcodeScanner.clear(); html5QrcodeScanner = null;
                searchProduct();
            });
        }
    }

    async function submitData() {
        if(!currentMode) { alert("กรุณาเลือกโหมด"); return; }
        
        let finalSku = (currentMode === 'NEW') ? document.getElementById('new-sku').value.trim() : document.getElementById('sku').value.trim();
        const qtyVal = document.getElementById('qty').value;
        
        if(!finalSku) { alert("กรุณาระบุรหัสสินค้า"); return; }
        if(!qtyVal || Number(qtyVal) <= 0) { alert("จำนวนต้องมากกว่า 0"); return; }
        if(currentMode === 'NEW' && !document.getElementById('item-name').value.trim()) { alert("กรุณาระบุชื่อสินค้า"); return; }

        const btn = document.getElementById('btn-submit');
        const oldText = btn.innerText;
        btn.innerText = "Processing...";
        btn.disabled = true;

        const payload = {
            mode: currentMode,
            sku: finalSku,
            qty: qtyVal,
            unit: document.getElementById('unit').value,
            // ข้อมูลเสริมสำหรับ NEW
            ratio: document.getElementById('new-ratio').value,
            name: document.getElementById('item-name').value,
            user: document.getElementById('user').value,
            sap_unit: document.getElementById('new-sap-unit').value,
            barcode: document.getElementById('new-barcode').value,
            weight: document.getElementById('new-weight').value,
            detail: document.getElementById('new-detail').value
        };

        try {
            const response = await fetch(WEBHOOK_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            });
            
            const data = await response.json();
            const logDiv = document.getElementById('log');
            const time = new Date().toLocaleTimeString('th-TH', {hour: '2-digit', minute:'2-digit'});

            if (data.status === 'error') {
                alert("❌ " + data.message); 
            } else if (data.status === 'error_log') {
                alert("❌ " + data.message);
                logDiv.innerHTML = `<div class="log-item" style="color:red;">[${time}] ❌ ${data.message}</div>` + logDiv.innerHTML;
            } else {
                alert("✅ " + data.message);
                let color = currentMode === 'IN' ? 'green' : (currentMode === 'OUT' ? 'blue' : 'orange');
                logDiv.innerHTML = `<div class="log-item" style="color:${color}">[${time}] ✅ ${data.message}</div>` + logDiv.innerHTML;
                
                // Reset Forms
                document.getElementById('sku').value = "";
                document.getElementById('new-sku').value = "";
                document.getElementById('item-name').value = "";
                document.getElementById('new-barcode').value = "";
                document.getElementById('new-weight').value = "";
                document.getElementById('new-detail').value = "";
                document.getElementById('name-display').value = "";
            }

        } catch(e) { alert("Connection Error"); } 
        finally { btn.innerText = oldText; btn.disabled = false; }
    }
</script>

</body>
</html>
